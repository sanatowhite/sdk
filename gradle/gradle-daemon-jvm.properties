#Gradle Daemon JVM criteria
#
# 本机默认 JDK（java_home）解析到 Temurin 26——太新，AGP 要求的 JDK 是 17。
# 固定到 17（不是 21）是刻意的：本机 Homebrew 已装 17.0.19 可以直接被
# Gradle 自动探测到；Android Studio 自带的 JBR 21 同样满足 AGP 的
# "JDK >= 17" 要求，但 Daemon JVM criteria 要求【精确】版本匹配，
# 曾经把这里设成 21 在 JitPack 的构建容器上导致硬失败——那个环境只有
# jitpack.yml 里装的 JDK 17，且没有为该架构配置 toolchain 自动下载 URL，
# Gradle 找不到精确匹配的 21 就直接报错退出。17 在本地 / CI / JitPack
# 三处都能找到现成安装，不会触发自动下载，是唯一能三处通用的选择。
#
# IDE 内构建：Android Studio 默认用自己的 JBR 跑 Gradle daemon，行为
# 不受本文件影响（Settings -> Build Tools -> Gradle -> Gradle JDK）。
# 命令行构建：若本机探测不到 JDK 17，临时执行
#   export JAVA_HOME="/Applications/Android Studio.app/Contents/jbr/Contents/Home"
# 也可以（JBR 21 满足 AGP 要求，只是不满足本文件这里精确匹配 17 的探测），
# 不要把这个机器相关路径提交进本文件或 gradle.properties。
toolchainVersion=17
