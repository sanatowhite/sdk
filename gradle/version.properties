versionCode=1
versionName=0.1.0

# ── SDK 发布坐标（与上面的 app 版本完全独立的两条轴）──
# sdkGroup 必须精确等于 com.github.<github-user>.<github-repo>：JitPack 用这个
# 路径反查要去构建哪个仓库，写错不会报错，只会永远 404。仓库改名
# sanatowhite/version-check-sdk → sanatowhite/sdk 之后才是 com.github.sanatowhite.sdk。
sdkGroup=com.github.sanatowhite.sdk
# sdkVersion 只是本地 publishToMavenLocal 的兜底 + CI 断言的比对基准——真正生效的
# 是发 tag 时的 -Pversion=$VERSION（tag 名逐字变成 Maven version）。
sdkVersion=1.0.0
