android.useAndroidX=true
android.nonTransitiveRClass=true
org.gradle.jvmargs=-Xmx3072m

# 开启 Firebase 遥测后端只需要改这一行 + 放入 app/google-services.json 两步。
# 默认关闭:clone 下来无需 google-services.json 即可编译运行,:telemetry-firebase
# 模块整个不参与构建(见 settings.gradle.kts / app/build.gradle.kts 的条件判断),
# 关闭时是零 Firebase 网络请求、零 Firebase 依赖,不是"依赖还在只是不生效"。
telemetryFirebaseEnabled=false
