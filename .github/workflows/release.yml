name: App Release

# 两套 tag namespace:SDK 用 v*(见 sdk-release.yml),App 用 app-v*——
# 这个 workflow 只响应后者,不要和 SDK 发布混在一起。
on:
  push:
    tags:
      - "app-v*"

jobs:
  release:
    name: Sign, publish, and push update JSON
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Assert version.properties matches the tag
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#app-v}"
          PROPS_VERSION=$(grep '^versionName=' gradle/version.properties | cut -d= -f2)
          if [ "$TAG_VERSION" != "$PROPS_VERSION" ]; then
            echo "::error::Tag app-v$TAG_VERSION does not match gradle/version.properties versionName=$PROPS_VERSION"
            exit 1
          fi

      - name: Decode signing keystore
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -z "${RELEASE_KEYSTORE_BASE64:-}" ]; then
            echo "::error::RELEASE_KEYSTORE_BASE64 secret is not set — see docs/adr for what needs configuring before this workflow can run for real."
            exit 1
          fi
          echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > release.keystore

      - name: Write keystore.properties
        env:
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          cat > keystore.properties <<EOF
          store.file=../release.keystore
          store.password=${STORE_PASSWORD}
          key.alias=${KEY_ALIAS}
          key.password=${KEY_PASSWORD}
          EOF

      - name: Assemble release APK
        run: ./gradlew :app:assembleRelease --stacktrace

      - name: Verify the APK is actually signed
        run: |
          APK=$(find app/build/outputs/apk/release -name "*.apk" | head -1)
          BUILD_TOOLS=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)
          "$BUILD_TOOLS/apksigner" verify "$APK"

      - name: Shred the keystore
        if: always()
        run: shred -u release.keystore keystore.properties 2>/dev/null || true

      - name: Generate release notes from changelog.json
        id: notes
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#app-v}"
          python3 - "$TAG_VERSION" <<'PYEOF'
          import json, sys
          version_name = sys.argv[1]
          with open("app/src/main/res/raw/changelog.json") as f:
              data = json.load(f)
          entry = next((e for e in data["entries"] if e["versionName"] == version_name), None)
          notes = "\n".join(f"- {h}" for h in entry["highlights"]) if entry else "(no changelog entry found)"
          with open("release_notes.md", "w") as out:
              out.write(notes)
          PYEOF

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/release/*.apk
          body_path: release_notes.md
          fail_on_unmatched_files: true

      # 跨仓库推送用 GitHub App(装在 sanatowhite/version_check 上,只给这一个仓库
      # 写权限)而不是长期有效的 PAT/deploy key——deploy key 只能挂一把,所有 app
      # 共用同一私钥是最差选择;GitHub App token 一小时过期,泄露影响面小得多。
      # ⚠️ 需要提前配置:创建 GitHub App、安装到 sanatowhite/version_check、
      # 把 App ID + 私钥存进 APP_ID / APP_PRIVATE_KEY 这两个 secret。
      - name: Mint a short-lived GitHub App token
        id: app-token
        if: ${{ vars.VERSION_CHECK_REPO != '' }}
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          repositories: version_check

      - name: Push update JSON to the static distribution repo
        if: ${{ vars.VERSION_CHECK_REPO != '' }}
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#app-v}"
          VERSION_CODE=$(grep '^versionCode=' gradle/version.properties | cut -d= -f2)
          APK_URL="https://github.com/${{ github.repository }}/releases/download/${GITHUB_REF_NAME}/app-release.apk"
          SHA256=$(sha256sum app/build/outputs/apk/release/*.apk | awk '{print $1}')

          python3 - "$TAG_VERSION" "$VERSION_CODE" "$APK_URL" "$SHA256" <<'PYEOF'
          import json, sys
          version_name, version_code, apk_url, sha256 = sys.argv[1:5]
          with open("app/src/main/res/raw/changelog.json") as f:
              changelog = json.load(f)
          entry = next((e for e in changelog["entries"] if e["versionName"] == version_name), None)
          release_notes = "\n".join(entry["highlights"]) if entry else ""
          update_json = {
              "versionCode": int(version_code),
              "versionName": version_name,
              "apkUrl": apk_url,
              "sha256": sha256,
              "releaseNotes": release_notes,
              "force": False,
          }
          with open("update.json", "w") as out:
              json.dump(update_json, out, indent=2)
          PYEOF

          gh repo clone "sanatowhite/${{ vars.VERSION_CHECK_REPO }}" version_check_repo -- --depth=1
          cp update.json version_check_repo/update.json
          cd version_check_repo
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add update.json
          git commit -m "Update to $TAG_VERSION" || echo "No changes to commit"
          git push

      - name: Poll the raw CDN for propagation
        if: ${{ vars.VERSION_CHECK_REPO != '' }}
        run: |
          URL="https://raw.githubusercontent.com/sanatowhite/${{ vars.VERSION_CHECK_REPO }}/main/update.json"
          TAG_VERSION="${GITHUB_REF_NAME#app-v}"
          for i in $(seq 1 30); do
            if curl -fsS "$URL" | grep -q "\"versionName\": \"$TAG_VERSION\""; then
              echo "CDN propagated after $((i * 10))s"
              exit 0
            fi
            sleep 10
          done
          echo "::warning::CDN did not show the new version within 5 minutes (raw.githubusercontent.com caches ~5 min, this is not necessarily a failure)"
