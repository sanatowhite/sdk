name: PR Check

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: pr-check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # JDK 17 统一——不是 21/26,原因见 gradle/gradle-daemon-jvm.properties 的注释
  # (JitPack 容器 + 本地 Homebrew + CI 三处都只保证有 17)。
  JAVA_VERSION: "17"

jobs:
  sdk-guard:
    name: sdk-guard (18 SDK modules)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - name: Cache Robolectric jars
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository/org/robolectric
          key: robolectric-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml') }}
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Test + apiCheck + module graph + publish-set consistency
        run: ./gradlew :updatechecker:test apiCheckAll verifyModuleGraph verifySdkModuleList verifySdkBomConstraints --stacktrace
      - name: Dry-run the exact JitPack install command
        # 逐字复刻 jitpack.yml 的 install 命令——把"JITPACK gate 每次拓扑变化需要
        # 手动验证"变成每个 PR 自动验证。0.0.0-smoke 只是本地探测版本号,不会真的
        # 发布到任何地方。
        run: JITPACK=true ./gradlew publishSdkToMavenLocal -Pversion=0.0.0-smoke --stacktrace
      - name: List published artifacts for manual diffing in the log
        run: find ~/.m2/repository/com/github/sanatowhite/sdk -type f | sort
      - name: consumer-smoke (local mode, against the mavenLocal artifacts just published)
        # 完全独立的 Gradle build(见 checks/consumer-smoke/README.md)——唯一能
        # 捕获 api()/implementation 判定错误和 Hilt 跨模块聚合在真实 AAR 消费下
        # 是否依然成立的机制,project() 依赖的 :app 测不出这类问题。
        working-directory: checks/consumer-smoke
        run: ./gradlew :app:assembleDebug -PsmokeVersion=0.0.0-smoke --stacktrace

  logkit-guard:
    name: logkit-guard (:logkit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - name: Cache Robolectric jars
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository/org/robolectric
          key: robolectric-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml') }}
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
      # :logkit-decrypt:test 是这里承重的一项——encrypt-in-:logkit →
      # decrypt-in-tool 的真实往返只在这里跑,是唯一能抓到格式漂移(比如
      # HKDF 的 info 字符串或某个字段偏移被改动却忘了两边同步)的地方。
      # 不要为了省 CI 分钟删掉它。
      - name: Test + apiCheck + decrypt round-trip
        run: ./gradlew :logkit:test :logkit:apiCheck :logkit-decrypt:test --stacktrace

  build-test-lint:
    name: build-test-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - name: Cache Robolectric jars
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository/org/robolectric
          key: robolectric-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml') }}
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Assemble, test, lint, format, module graph
        run: ./gradlew assembleDebug testDebugUnitTest lintDebug spotlessCheck verifyModuleGraph --stacktrace

  screenshot:
    name: screenshot (Roborazzi)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - name: Cache Robolectric jars
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository/org/robolectric
          key: robolectric-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml') }}
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Verify screenshot baselines
        run: ./gradlew verifyRoborazziDebug --stacktrace
      - name: Upload diff report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: roborazzi-diff-report
          path: "**/build/outputs/roborazzi/**"
          retention-days: 14

  release-smoke:
    name: release-smoke (R8 + keep rules)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Assemble release
        run: ./gradlew :app:assembleRelease --stacktrace
      - name: Assert zero debug-tools residue in release APK
        run: |
          APK=$(find app/build/outputs/apk/release -name "*.apk" | head -1)
          BUILD_TOOLS=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)
          if "$BUILD_TOOLS/apkanalyzer" dex packages "$APK" | grep -qE "debugtools|leakcanary|okhttp3\.logging"; then
            echo "::error::debug-only code leaked into the release APK"
            exit 1
          fi

  quality-report:
    name: quality-report (detekt + kover)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Detekt (advisory) + Kover aggregate report
        run: ./gradlew detekt koverHtmlReport --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: quality-reports
          path: |
            **/build/reports/detekt/**
            build/reports/kover/**
          retention-days: 14
