name: Generate Baseline Profile

# 手动触发,不进 pr-check——生成 baseline profile 要跑 Gradle Managed Device,
# 15-20 分钟量级,不适合作为每次 PR 都要等的门禁。产物(app/src/release/generated/
# baselineProfiles/*.txt)是构建输入不是输出,必须提交进库,automaticGenerationDuringBuild
# 保持 false(见 build.gradle.kts 里 :baselineprofile 模块的说明)。
#
# Phase 11(把 core-*/feature-* 改成发布 AAR 那次改造)里在真机上重新采集过一次
# ——旧 profile 里 682 行含 apptemplate 的 JVM 描述符,包名迁移 + 模块搬迁后
# 指向不存在的类,新 profile 已确认零残留、feature-settings/feedback/licenses/
# update 四个新模块的类都正确出现在里面。这个 workflow 走 Gradle Managed Device
# (虚拟设备),产出会和真机采的有细微差异,属于预期内正常波动。
on:
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Enable KVM for the Gradle Managed Device
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Generate baseline profile
        run: ./gradlew :app:generateReleaseBaselineProfile --stacktrace

      - name: Commit the generated profile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add app/src/release/generated/baselineProfiles
          git diff --cached --quiet && echo "No profile changes." && exit 0
          git commit -m "Regenerate release baseline profile"
          git push
