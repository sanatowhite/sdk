name: Generate Baseline Profile

# 手动触发,不进 pr-check——生成 baseline profile 要跑 Gradle Managed Device,
# 15-20 分钟量级,不适合作为每次 PR 都要等的门禁。产物(app/src/release/generated/
# baselineProfiles/*.txt)是构建输入不是输出,必须提交进库,automaticGenerationDuringBuild
# 保持 false(见 build.gradle.kts 里 :baselineprofile 模块的说明)。
#
# ⚠️ 依赖 :baselineprofile 模块里的真实 BaselineProfileGenerator 测试类——
# Phase 11 之前那个模块只有拓扑骨架,这个 workflow 现在能跑但产出的 profile
# 内容还不代表真实的关键路径,等 Phase 11 补上测试类之后这里才有实际意义。
on:
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Enable KVM for the Gradle Managed Device
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Generate baseline profile
        run: ./gradlew :app:generateReleaseBaselineProfile --stacktrace

      - name: Commit the generated profile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add app/src/release/generated/baselineProfiles
          git diff --cached --quiet && echo "No profile changes." && exit 0
          git commit -m "Regenerate release baseline profile"
          git push
